name: ShanghaiAction
options:
  bundleIdPrefix: com.cylagent
  deploymentTarget:
    iOS: "17.0"
targets:
  ShanghaiAction:
    type: application
    platform: iOS
    sources: [ShanghaiAction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cylagent.shanghaiaction
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: ShanghaiAction/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

